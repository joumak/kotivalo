[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kotivalo"
version = "0.1.0"
description = "Kotivalo: home lighting control for IKEA Zigbee lights (sunrise alarm, motion, remotes) with zigpy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "zigpy==2.3.0",
    "zigpy-xbee==0.22.0",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
# Fallback radios: only the radio settings change, the app code stays the same.
ezsp = ["bellows==1.1.0"]
znp = ["zigpy-znp==1.1.1"]
dev = ["pytest", "pytest-asyncio", "pytest-aiohttp", "ruff"]

[project.scripts]
kotivalo = "kotivalo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kotivalo"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
